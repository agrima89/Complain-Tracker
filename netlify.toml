# ------------------------------------------------------------------------------
# CACHE-CONTROL HEADERS (Force revalidation of HTML to prevent stale deploys)
# ------------------------------------------------------------------------------
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

