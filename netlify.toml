[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node scripts/build.js"

[build.environment]
  NODE_VERSION = "22"

[functions]
  included_files = []


# ------------------------------------------------------------------------------
# API FUNCTION REWRITES
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth-login"
