# ------------------------------------------------------------------------------
# DYNAMIC PDF & EVIDENCE STREAMING REWRITES
# ------------------------------------------------------------------------------
[[redirects]]
  from = "/complaints/:id/evidence"
  to = "/.netlify/functions/evidence-get?complaint_id=:id"
  status = 200

[[redirects]]
  from = "/student/complaint/:id/download-pdf"
  to = "/.netlify/functions/pdf-generate?id=:id"
  status = 200

[[redirects]]
  from = "/student/complaint/:id/pdf"
  to = "/.netlify/functions/pdf-generate?id=:id"
  status = 200

[[redirects]]
  from = "/admin/complaint/:id/download-pdf"
