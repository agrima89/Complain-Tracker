<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="All the complaints you've reported on CampusCare.">
  <title>My complaints · CampusCare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app">

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="/" class="brand" aria-label="CampusCare home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6-9 6-9-6z"/><path d="M7 12.5V17c3 2 7 2 10 0v-4.5"/></svg>
        </span>
        CampusCare
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/student-dashboard">Dashboard</a>
        <a href="/my-complaints" aria-current="page">My complaints</a>
        <a href="/submit-complaint">Report issue</a>
        <a href="/profile">Profile</a>
      </nav>
      <div class="user">
        <span class="avatar" id="userInitials" aria-hidden="true">·</span>
        <span class="user-name" id="userName"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="wrap">

      <div class="page-head">
        <div>
          <h1 class="page-title">My complaints</h1>
          <p class="page-sub">Everything you've reported, newest first.</p>
        </div>
        <a href="/submit-complaint" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Report an issue
        </a>
      </div>

      <form class="toolbar" id="filterForm" role="search">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" class="input" id="searchInput" placeholder="Search ticket, category, block…" aria-label="Search complaints">
        </div>
        <select class="select" id="statusSelect" aria-label="Filter by status">
          <option value="All">All statuses</option>
          <option value="NEW">Open</option>
          <option value="FORWARDED">Forwarded</option>
          <option value="IN_PROGRESS">In progress</option>
          <option value="REOPENED">Reopened</option>
          <option value="AWAITING_STUDENT_CONFIRMATION">Awaiting you</option>
          <option value="FINAL_RESOLVED">Resolved</option>
        </select>
      </form>

      <section class="panel" aria-labelledby="listTitle">
        <div class="panel-head">
          <h2 class="panel-title" id="listTitle">Complaints</h2>
          <span class="panel-meta" id="countMeta"></span>
        </div>
        <ul class="rows" id="list">
          <li class="row"><div class="row-main"><div class="skeleton" style="width:40%"></div><div class="skeleton" style="width:65%;margin-top:8px"></div></div></li>
          <li class="row"><div class="row-main"><div class="skeleton" style="width:35%"></div><div class="skeleton" style="width:55%;margin-top:8px"></div></div></li>
          <li class="row"><div class="row-main"><div class="skeleton" style="width:45%"></div><div class="skeleton" style="width:60%;margin-top:8px"></div></div></li>
        </ul>
        <div class="pager" id="pager" hidden>
          <span id="pageInfo"></span>
          <div>
            <button type="button" class="btn btn-ghost btn-sm" id="prevBtn">← Previous</button>
            <button type="button" class="btn btn-ghost btn-sm" id="nextBtn">Next →</button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© 2026 CampusCare</span>
      <span>Student grievance portal</span>
    </div>
  </footer>

  <dialog class="modal" id="deleteModal">
    <h3>Delete this complaint?</h3>
    <p>The complaint and its photo will be permanently removed. This can't be undone.</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="cancelDeleteBtn">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </dialog>

  <script src="/static/js/auth-state.js"></script>
  <script>
    const STATUS = {
      NEW: ['open', 'Open'],
      FORWARDED: ['open', 'Forwarded'],
      IN_PROGRESS: ['progress', 'In progress'],
      REOPENED: ['reopened', 'Reopened'],
      REGENERATED: ['reopened', 'Reopened'],
      RESOLUTION_SUBMITTED: ['awaiting', 'Confirm fix'],
      AWAITING_STUDENT_CONFIRMATION: ['awaiting', 'Confirm fix'],
      FINAL_RESOLVED: ['resolved', 'Resolved']
    };
    // Legacy status spellings from older records.
    Object.assign(STATUS, { RESOLVED: STATUS.FINAL_RESOLVED, 'IN PROGRESS': STATUS.IN_PROGRESS, PENDING: STATUS.NEW, CLOSED: STATUS.FINAL_RESOLVED });
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (id) => document.getElementById(id);

    function formatDate(d) {
      const date = new Date(String(d).replace(' ', 'T'));
      return isNaN(date) ? esc(d) : date.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function renderRow(item) {
      const [cls, label] = STATUS[item.status] || ['', String(item.status || '').replace(/_/g, ' ')];
      const location = [item.block || item.location, item.room_no && `Room ${item.room_no}`].filter(Boolean).join(', ');
      const prio = item.priority === 'High' ? '<span class="prio-high">High priority</span>' : `${esc(item.priority || 'Medium')} priority`;
      const del = item.status === 'NEW'
        ? `<button type="button" class="btn btn-ghost btn-sm btn-icon" data-delete="${esc(item.complaint_id)}" aria-label="Delete ${esc(item.ticket_id)}" title="Delete">
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>
           </button>`
        : '<span class="btn-icon" aria-hidden="true"></span>';
      return `
        <li class="row">
          <a class="row-main" href="/student/complaint/${encodeURIComponent(item.complaint_id)}">
            <div class="row-title">${esc(item.category)} <span class="ticket">${esc(item.ticket_id)}</span></div>
            <div class="row-meta">${esc(location) || 'Campus'}<span class="sep">·</span>${prio}<span class="sep">·</span>${formatDate(item.date)}</div>
          </a>
          <span class="pill ${cls}">${esc(label)}</span>
          <div class="row-actions">${del}</div>
        </li>`;
    }

    let page = 1, totalPages = 1, pendingId = null, timer = null;

    async function load() {
      const params = new URLSearchParams({ page, per_page: 10, status: $('statusSelect').value, q: $('searchInput').value.trim() });
      const list = $('list');
      try {
        const res = await fetch(`/api/complaints-list?${params}`);
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.error || 'Request failed');
        const { complaints = [], pagination = {} } = json.data;
        page = pagination.page || 1;
        totalPages = Math.max(pagination.total_pages || 1, 1);
        const total = pagination.total_items ?? complaints.length;
        $('countMeta').textContent = total ? `${total} total` : '';
        $('pager').hidden = totalPages <= 1;
        $('pageInfo').textContent = `Page ${page} of ${totalPages}`;
        $('prevBtn').disabled = page <= 1;
        $('nextBtn').disabled = page >= totalPages;

        const filtered = params.get('q') || params.get('status') !== 'All';
        list.innerHTML = complaints.length
          ? complaints.map(renderRow).join('')
          : filtered
            ? `<li class="empty"><h3>No matches</h3><p>Try a different search or status.</p>
                 <button type="button" class="btn btn-ghost btn-sm" id="clearBtn">Clear filters</button></li>`
            : `<li class="empty"><h3>No complaints yet</h3><p>Spotted something broken on campus? Report it and track the fix here.</p>
                 <a href="/submit-complaint" class="btn btn-primary btn-sm">Report your first issue</a></li>`;
      } catch (err) {
        console.error('Failed to load complaints:', err);
        list.innerHTML = `<li class="empty"><h3>Couldn't load your complaints</h3><p>Check your connection and try again.</p>
          <button type="button" class="btn btn-ghost btn-sm" onclick="location.reload()">Retry</button></li>`;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await window.CampusCareAuth.requireStudent();
      if (!user) return;
      const name = user.student_name || 'Student';
      $('userName').textContent = name;
      $('userInitials').textContent = name.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('');
      $('logoutBtn').addEventListener('click', () => window.CampusCareAuth.handleLogout());

      const initialStatus = new URLSearchParams(location.search).get('status');
      if (initialStatus && [...$('statusSelect').options].some(o => o.value === initialStatus)) $('statusSelect').value = initialStatus;
      load();

      $('filterForm').addEventListener('submit', (e) => { e.preventDefault(); page = 1; load(); });
      $('searchInput').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(() => { page = 1; load(); }, 300); });
      $('statusSelect').addEventListener('change', () => { page = 1; load(); });
      $('prevBtn').addEventListener('click', () => { if (page > 1) { page--; load(); } });
      $('nextBtn').addEventListener('click', () => { if (page < totalPages) { page++; load(); } });

      const modal = $('deleteModal');
      $('list').addEventListener('click', (e) => {
        if (e.target.closest('#clearBtn')) {
          $('searchInput').value = ''; $('statusSelect').value = 'All'; page = 1; return load();
        }
        const btn = e.target.closest('[data-delete]');
        if (!btn) return;
        pendingId = btn.dataset.delete;
        modal.showModal();
      });
      $('cancelDeleteBtn').addEventListener('click', () => modal.close());
      $('confirmDeleteBtn').addEventListener('click', async () => {
        const btn = $('confirmDeleteBtn');
        btn.disabled = true; btn.textContent = 'Deleting…';
        try {
          const res = await fetch('/api/complaints-delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ complaint_id: pendingId }) });
          const json = await res.json();
          if (!res.ok || !json.success) throw new Error(json.error || 'Failed to delete complaint.');
          modal.close();
          load();
        } catch (err) {
          alert(err.message);
        }
        btn.disabled = false; btn.textContent = 'Delete';
      });
    });
  </script>
</body>
</html>
