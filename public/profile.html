<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your CampusCare account.">
  <title>Profile · CampusCare</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app">

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="/" class="brand" aria-label="CampusCare home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6-9 6-9-6z"/><path d="M7 12.5V17c3 2 7 2 10 0v-4.5"/></svg>
        </span>
        CampusCare
      </a>
      <nav class="nav" aria-label="Main" id="nav"></nav>
      <div class="user">
        <span class="avatar" id="userInitials" aria-hidden="true">·</span>
        <span class="user-name" id="userName"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="wrap narrow">

      <div class="profile-head">
        <span class="avatar avatar-lg" id="bigInitials" aria-hidden="true">·</span>
        <div>
          <h1 class="page-title" id="profileName">Loading…</h1>
          <p class="page-sub" id="profileRole"></p>
        </div>
      </div>

      <section class="stats stats-3" aria-label="Activity summary">
        <div class="stat">
          <div class="stat-label"><i style="background:var(--st-open)"></i><span id="totalLabel">Reported</span></div>
          <div class="stat-value" id="statTotal">–</div>
        </div>
        <div class="stat">
          <div class="stat-label"><i style="background:var(--st-progress)"></i>Still open</div>
          <div class="stat-value" id="statOpen">–</div>
        </div>
        <div class="stat">
          <div class="stat-label"><i style="background:var(--st-resolved)"></i>Resolved</div>
          <div class="stat-value" id="statResolved">–</div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2 class="panel-title">Account</h2></div>
        <dl class="kv-list" id="facts"></dl>
      </section>

      <div class="form-actions">
        <a class="btn btn-ghost" id="homeBtn" href="/student-dashboard">Back to dashboard</a>
        <button type="button" class="btn btn-danger-ghost" id="signOutBtn">Sign out</button>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© 2026 CampusCare</span>
      <span>Student grievance portal</span>
    </div>
  </footer>

  <script src="/static/js/auth-state.js"></script>
  <script>
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (id) => document.getElementById(id);
    const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0].toUpperCase()).join('') || '·';

    const NAV = {
      student: [['/student-dashboard', 'Dashboard'], ['/my-complaints', 'My complaints'], ['/submit-complaint', 'Report issue'], ['/profile', 'Profile']],
      admin: [['/admin-dashboard', 'Complaints'], ['/soc', 'Audit log'], ['/admin/staff', 'Staff'], ['/profile', 'Profile']]
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const { authenticated, user } = await window.CampusCareAuth.fetchSession();
      if (!authenticated || !user) return (location.href = '/login?redirect=/profile');

      const isStudent = user.role === 'student';
      $('nav').innerHTML = NAV[isStudent ? 'student' : 'admin']
        .filter(([href]) => href !== '/admin/staff' || !user.admin_department)
        .map(([href, text]) => `<a href="${href}"${href === '/profile' ? ' aria-current="page"' : ''}>${text}</a>`).join('');

      const name = isStudent ? (user.student_name || 'Student') : (user.admin_username || 'Administrator');
      $('userName').textContent = name;
      $('userInitials').textContent = initials(name);
      $('bigInitials').textContent = initials(name);
      $('profileName').textContent = name;
      $('profileRole').textContent = isStudent
        ? 'Student account'
        : (user.admin_department ? `${user.admin_department} department admin` : 'Administrator · all departments');
      $('homeBtn').href = isStudent ? '/student-dashboard' : '/admin-dashboard';
      $('homeBtn').textContent = isStudent ? 'Back to dashboard' : 'Back to complaints';

      const logout = () => window.CampusCareAuth.handleLogout();
      $('logoutBtn').addEventListener('click', logout);
      $('signOutBtn').addEventListener('click', logout);

      const facts = isStudent
        ? [['Name', name], ['Email', user.student_email], ['Student ID', `STU-${String(user.student_id).padStart(4, '0')}`], ['Role', 'Student']]
        : [['Username', name], ['Email', user.admin_email], ['Department', user.admin_department || 'All departments'], ['Role', user.admin_role || 'Administrator']];
      $('facts').innerHTML = facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v || '—')}</dd></div>`).join('');

      if (!isStudent) $('totalLabel').textContent = 'Total complaints';
      try {
        const res = await fetch(isStudent ? '/api/complaints-list?page=1&per_page=1' : '/api/admin-stats');
        const json = await res.json();
        const s = json.data?.stats || {};
        const total = s.total || 0, resolved = s.resolved || 0;
        $('statTotal').textContent = total;
        $('statResolved').textContent = resolved;
        $('statOpen').textContent = Math.max(total - resolved, 0);
      } catch {
        ['statTotal', 'statOpen', 'statResolved'].forEach(id => $(id).textContent = '—');
      }
    });
  </script>
</body>
</html>
