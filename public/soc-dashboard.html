<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CampusCare security and access audit log.">
  <title>Audit log · CampusCare Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="app">

  <header class="topbar">
    <div class="wrap topbar-inner">
      <a href="/admin-dashboard" class="brand" aria-label="CampusCare admin home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6-9 6-9-6z"/><path d="M7 12.5V17c3 2 7 2 10 0v-4.5"/></svg>
        </span>
        CampusCare <span class="brand-tag">Admin</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/admin-dashboard">Complaints</a>
        <a href="/soc" aria-current="page">Audit log</a>
        <a href="/admin/staff" data-super hidden>Staff</a>
        <a href="/profile">Profile</a>
      </nav>
      <div class="user">
        <span class="avatar" id="userInitials" aria-hidden="true">·</span>
        <span class="user-name" id="userName"></span>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Log out</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="wrap">

      <div class="page-head">
        <div>
          <h1 class="page-title">Audit log</h1>
          <p class="page-sub">Sign-ins, failed attempts and blocked access across the portal.</p>
        </div>
      </div>

      <section class="stats" aria-label="Summary">
        <div class="stat">
          <div class="stat-label"><i style="background:var(--text-3)"></i>Events</div>
          <div class="stat-value" id="statTotal">–</div>
        </div>
        <div class="stat">
          <div class="stat-label"><i style="background:var(--st-open)"></i>Failed sign-ins</div>
          <div class="stat-value" id="statFailed">–</div>
        </div>
        <div class="stat">
          <div class="stat-label"><i style="background:var(--st-awaiting)"></i>Blocked access</div>
          <div class="stat-value" id="statUnauth">–</div>
        </div>
        <div class="stat">
          <div class="stat-label"><i style="background:var(--danger)"></i>High severity</div>
          <div class="stat-value" id="statHigh">–</div>
        </div>
      </section>

      <form class="toolbar" id="filterForm" role="search">
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input type="search" class="input" id="searchInput" placeholder="Filter by event, email or detail…" aria-label="Filter events">
        </div>
        <select class="select" id="sevFilter" aria-label="Severity">
          <option value="">All severities</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
        </select>
      </form>

      <section class="panel" aria-labelledby="logTitle">
        <div class="panel-head">
          <h2 class="panel-title" id="logTitle">Recent events</h2>
          <span class="panel-meta" id="countMeta">Last 100</span>
        </div>
        <ul class="rows" id="list">
          <li class="row"><div class="row-main"><div class="skeleton" style="width:40%"></div><div class="skeleton" style="width:65%;margin-top:8px"></div></div></li>
        </ul>
      </section>

    </div>
  </main>

  <footer class="footer">
    <div class="wrap">
      <span>© 2026 CampusCare</span>
      <span>Administration</span>
    </div>
  </footer>

  <script src="/static/js/auth-state.js"></script>
  <script>
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (id) => document.getElementById(id);
    const SEV = { HIGH: 'reopened', MEDIUM: 'open', LOW: '' };
    const pretty = (s) => String(s || '').toLowerCase().replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
    let logs = [];

    function fmt(d) {
      const date = new Date(String(d).replace(' ', 'T'));
      return isNaN(date) ? esc(d) : date.toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
    }

    function render() {
      const q = $('searchInput').value.trim().toLowerCase();
      const sev = $('sevFilter').value;
      const shown = logs.filter(l =>
        (!sev || (l.severity || 'LOW') === sev) &&
        (!q || [l.event_type, l.user_email, l.details, l.department].join(' ').toLowerCase().includes(q)));
      $('countMeta').textContent = shown.length === logs.length ? `Last ${logs.length}` : `${shown.length} of ${logs.length}`;
      $('list').innerHTML = shown.length
        ? shown.map(l => {
            const s = l.severity || 'LOW';
            return `
              <li class="row row-static">
                <div class="row-main">
                  <div class="row-title">${esc(pretty(l.event_type))}</div>
                  <div class="row-meta" title="${esc(l.details || '')}">${esc(l.user_email || 'Unknown user')}${l.department ? `<span class="sep">·</span>${esc(l.department)}` : ''}${l.details ? `<span class="sep">·</span>${esc(l.details)}` : ''}</div>
                </div>
                <span class="pill ${SEV[s] ?? ''}">${esc(pretty(s))}</span>
                <span class="log-time">${fmt(l.timestamp)}</span>
              </li>`;
          }).join('')
        : `<li class="empty"><h3>${logs.length ? 'No matching events' : 'No events recorded yet'}</h3><p>${logs.length ? 'Try a different filter.' : 'Sign-ins and access checks will show up here.'}</p></li>`;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const user = await window.CampusCareAuth.requireAdmin();
      if (!user) return;
      const name = user.admin_username || 'Admin';
      $('userName').textContent = name;
      $('userInitials').textContent = name.slice(0, 2).toUpperCase();
      $('logoutBtn').addEventListener('click', () => window.CampusCareAuth.handleLogout());

      try {
        const res = await fetch('/api/soc-logs');
        const json = await res.json();
        if (!res.ok || !json.success) throw new Error(json.error || 'Request failed');
        const d = json.data || {};
        logs = d.logs || [];
        $('statTotal').textContent = d.total || 0;
        $('statFailed').textContent = d.failed_logins || 0;
        $('statUnauth').textContent = d.unauthorized || 0;
        $('statHigh').textContent = d.high_severity || 0;
        render();
      } catch (err) {
        $('list').innerHTML = `<li class="empty"><h3>Couldn't load the audit log</h3><p>${esc(err.message)}</p></li>`;
      }

      $('filterForm').addEventListener('submit', (e) => e.preventDefault());
      $('searchInput').addEventListener('input', render);
      $('sevFilter').addEventListener('change', render);
    });
  </script>
</body>
</html>
